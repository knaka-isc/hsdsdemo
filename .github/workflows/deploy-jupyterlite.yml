name: Deploy JupyterLite

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install micromamba and build environment
        uses: mamba-org/setup-micromamba@v3
        with:
          micromamba-version: '2.0.5-0'
          environment-file: .github/build-environment.yml
          cache-environment: true

      - name: Download Pyodide wheels
        shell: bash -l {0}
        run: |
          mkdir -p wheels
          python -m pip download --no-deps --only-binary=:all: -d wheels seaborn

      - name: Build JupyterLite
        shell: bash -l {0}
        run: |
          jupyter lite build \
            --contents content \
            --output-dir _output \
            --piplite-wheels wheels/*.whl \
            --base-url /hsdsdemo/ \
            --no-sourcemaps \
            --force

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _output

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
